name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          # 媒体模块 (xhs_media/douyin_media) 仅依赖标准库，无需 pip install。
          # 各测试文件自带 main() runner；任一失败即非零退出。
          failed=0
          for t in tests/test_*.py; do
            echo "::group:: $t"
            python "$t" || failed=1
            echo "::endgroup::"
          done
          exit $failed
